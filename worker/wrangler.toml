name = "daobox-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 绑定域名（部署时自动配置 DNS 和证书）
routes = [
  { pattern = "daobox.app", custom_domain = true },
  { pattern = "api.daobox.app", custom_domain = true }
]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "daobox-db"
database_id = "ce6de996-0995-485c-b0ea-5ae0c5a11417"

# 管理密钥：用于 /admin/* 接口（生成激活码、确认订单、解绑）。
[vars]
ADMIN_KEY = "91fe1d1ae28599d0031c64832e6de56619b80ea51193ef96"

# 前端静态资源（public/）由 Worker 直接托管 → daobox.app 就是完整站点
# 注意：[assets] 必须放在所有顶层 key 之后（TOML 表作用域）
[assets]
directory = "../public"

name = "daobox-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 绑定域名（部署时自动配置 DNS 和证书）
routes = [
  { pattern = "vocab.daobox.app", custom_domain = true },
  { pattern = "api.daobox.app", custom_domain = true }
]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "daobox-db"
database_id = "ce6de996-0995-485c-b0ea-5ae0c5a11417"

# 管理密钥：用于 /admin/* 接口（生成激活码、确认订单、解绑）。
[vars]
# ADMIN_KEY 已于 2026-11-20 从本文件移除（此前随公开仓库泄露，等同公开 API 凭证）。
# 现改用 Cloudflare 加密 Secret：cd worker && <wrangler> secret put ADMIN_KEY
# 必须是 32 位十六进制字符串（与 daobox-home / suan-pwa 三家同值，部署链路依赖它对齐）

# 前端静态资源（public/）由 Worker 直接托管 → vocab.daobox.app 就是完整站点
# 注意：[assets] 必须放在所有顶层 key 之后（TOML 表作用域）
[assets]
directory = "../public"

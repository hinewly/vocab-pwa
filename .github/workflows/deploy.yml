name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 自动 bump service-worker.js 里的 CACHE_VERSION + 所有 ?v=N 资源链接
      - name: Bump SW cache version
        run: |
          set -e
          CURRENT=$(grep -oE "CACHE_VERSION = 'v[0-9]+'" public/service-worker.js | grep -oE 'v[0-9]+' | tr -d 'v')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW="v$((CURRENT + 1))-${SHORT_SHA}"
          echo "Bumping CACHE_VERSION: ${CURRENT} → ${NEW}"
          sed -i "s/CACHE_VERSION = 'v${CURRENT}'/CACHE_VERSION = '${NEW}'/" public/service-worker.js
          sed -i "s/?v=${CURRENT}/?v=${NEW}/g" public/service-worker.js
          # 不需要 commit 这个改动（这是 build-time 修改）

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 自动 bump service-worker.js 里的 CACHE_VERSION
      # 注意：bump 发生在 build time，不 commit 回仓库
      - name: Bump SW cache version
        run: |
          set -e
          CURRENT=$(grep -oE "CACHE_VERSION = '[^']+'" public/service-worker.js | grep -oE "'[^']+'" | tr -d "'")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW="v${CURRENT##*v}-${SHORT_SHA}"
          echo "Bumping CACHE_VERSION: ${CURRENT} → ${NEW}"
          sed -i "s/CACHE_VERSION = '${CURRENT}'/CACHE_VERSION = '${NEW}'/" public/service-worker.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

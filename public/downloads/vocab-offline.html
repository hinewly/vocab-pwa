document.getElementById('app').addEventListener('click', onAction);

/** 统一点击处理 */
function onAction(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const cat = el.dataset.cat;
  switch (a) {
    case 'go-home': location.hash = '#/'; break;
    case 'go-cat':  location.hash = '#/cat/' + cat; break;
    case 'go-label-book': {
      labelBookState.search = '';
      location.hash = `#/label-book/${cat}/${el.dataset.label}/1`;
      break;
    }
    case 'label-book-search': {
      const input = document.getElementById('label-book-search');
      labelBookState.search = input ? input.value.trim() : '';
      route();
      break;
    }
    case 'label-book-select': selectLabelBookPage(el.dataset.mode); break;
    case 'label-book-page': {
      const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
      const current = parseInt(parts[3] || '1', 10);
      const next = el.dataset.page === 'prev' ? current - 1 : current + 1;
      location.hash = `#/label-book/${parts[1]}/${parts[2] || 'know'}/${Math.max(1, next)}`;
      break;
    }
    case 'label-book-batch-label': markLabelBookBatchLabel(el.dataset.cat, el.dataset.label); break;
    case 'go-stats':location.hash = '#/stats'; break;
    case 'go-devplan': location.hash = '#/dev-plan'; break;
    case 'go-changelog': location.hash = '#/changelog'; break;
    case 'go-review':location.hash = '#/review/' + cat; break;
    case 'go-lookup':location.hash = '#/lookup'; break;
    case 'go-phrase':location.hash = '#/phrase'; break;
    case 'go-affix':location.hash = '#/affix'; break;
    case 'affix-study': startAffixBatch(parseInt(el.dataset.num, 10)); break;
    case 'go-affix-words': location.hash = '#/affix-words'; break;
    case 'affix-batch-mode': switchAffixBatchMode(el.dataset.mode); break;
    case 'affix-batch-mode-filter': affixBatch.wordFilter = el.dataset.filter || 'all'; route(); break;
    case 'affix-word-tag-toggle': break;
    case 'affix-word-label': {
      const word = el.dataset.word;
      const label = el.dataset.label;
      if (!word) break;
      if (label) {
        setAffixExampleWordLabel(word, label, findAffixExampleItem(word));
        const st = affixWordState(word);
        const isNew = st.isNew;
        showToast(`已把 ${st.word} 标为「${LABELS[label].name}」${isNew ? '，可在词缀例词本复习' : '，原词库复习会出现'}`, 'success');
      } else {
        clearAffixExampleWordLabel(word);
        showToast(`已清除 ${normalizeWordKey(word)} 的例词标签`, 'success');
      }
      route();
      break;
    }
    case 'affix-words-review': {
      const n = parseInt(el.dataset.n || '20', 10);
      const words = pickAffixExampleWords(['fuzzy', 'key', 'must'], n);
      if (!words.length) { alert('暂无可复习的词缀例词，先在例词上标记「模糊 / 重点 / 必背」吧'); return; }
      startSession('affix-words', words);
      location.hash = `#/study/affix-words/${n}`;
      break;
    }
    case 'affix-batch-check': updateAffixBatchCount(); break;
    case 'affix-batch-select': selectAffixBatch(el.dataset.mode); break;
    case 'affix-batch-label': markAffixBatchLabel(el.dataset.label); break;
    case 'affix-batch-study': startAffixStudyFromBatch(el.dataset.mode === 'checked'); break;
    case 'affix-words-filter': affixWordsFilter = el.dataset.filter || 'all'; route(); break;
    case 'affix-words-select': selectAffixBatch(el.dataset.mode); break;
    case 'affix-words-label': markAffixWordsBookLabel(el.dataset.label); break;
    case 'flip-affix': flipAffixCard(); break;
    case 'label-affix': markAffixLabel(el.dataset.label); break;
    case 'go-profile':location.hash = '#/profile'; break;
    case 'go-unlock':location.hash = '#/unlock'; break;
    case 'order-submit': {
      const pInput = document.getElementById('order-phone');
      const nInput = document.getElementById('order-nick');
      const cBtn = pInput?.parentElement?.querySelector('button');
      const phone = (pInput?.value || '').trim();
      const nick = (nInput?.value || '').trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showToast('请填写正确的11位手机号', 'error');
        break;
      }
      if (nick.length < 1) {
        showToast('请填写微信昵称（收款方看到的名称）', 'error');
        break;
      }
      const contact = phone + ' / ' + nick;
      if (cBtn) { cBtn.disabled = true; cBtn.textContent = '提交中…'; }
      submitOrder(contact).finally(() => {
        if (cBtn) { cBtn.disabled = false; cBtn.textContent = '登记'; }
      });
      break;
    }
    case 'unlock-submit': {
      const input = document.getElementById('unlock-code');
      const btn = input?.parentElement?.querySelector('button');
      if (btn) { btn.disabled = true; btn.textContent = '验证中…'; }
      submitUnlock(input?.value).finally(() => {
        if (btn) { btn.disabled = false; btn.textContent = '解锁'; }
      });
      break;
    }
    case 'refresh-app': refreshApp(); break;
    case 'search':  doSearch(); break;
    case 'lookup-study': {
      const n = parseInt(el.dataset.n || '20', 10);
      const words = pickFromLookups(n);
      if (words.length === 0) { alert('查词本为空，先去首页搜几个单词吧'); return; }
      startSession('lookup', words);
      location.hash = `#/study/lookup/${n}`;
      break;
    }
    case 'lookup-label': {
      // 查询结果里直接打标签：存到真实分类
      const c = el.dataset.cat;
      const w = el.dataset.word;
      const lb = el.dataset.label;
      if (!c || !w || !lb) return;
      STORE.labels[wordKey(c, w)] = lb;
      persist();
      doSearch(); // 刷新结果卡片的标签显示
      break;
    }
    case 'phrase-study': {
      const n = parseInt(el.dataset.n || '20', 10);
      const words = pickPhrases(n);
      if (words.length === 0) { alert('短语本为空或已全部过关'); return; }
      startSession('phrase', words);
      location.hash = `#/study/phrase/${n}`;
      break;
    }
    case 'study': {
      const n = parseInt(el.dataset.n || '20', 10);
      startSession(cat, pickWords(cat, n));
      location.hash = `#/study/${cat}/${n}`;
      break;
    }
    case 'review-num':
      reviewSel.n = parseInt(el.dataset.n, 10);
      document.querySelectorAll('.review-n').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      break;
    case 'review-start': {
      const labels = [...document.querySelectorAll('.checks input:checked')].map(i => i.value);
      if (labels.length === 0) { alert('请至少勾选一个标签'); return; }
      const words = pickByLabels(cat, labels, reviewSel.n);
      if (words.length === 0) { alert('该标签下暂无单词'); return; }
      startSession(cat, words);
      location.hash = `#/study/${cat}/${reviewSel.n}`;
      break;
    }
    case 'review-graduate': {
      // 从过关词（标"过关"）里抽 20 个复习；复习时打其他标签会自动回炉训练池
      const words = pickByLabels(cat, ['graduate'], 20);
      if (words.length === 0) { alert('暂无过关词，先背几轮标"过关"吧'); return; }
      startSession(cat, words);
      location.hash = `#/study/${cat}/20`;
      break;
    }
    case 'reset-graduate': {
      // 一键清空该分类所有"过关"标签，过关词全部放回训练池（学习记录保留）
      const cnt = Object.keys(STORE.labels).filter(k => k.startsWith(cat + ':') && STORE.labels[k] === 'graduate').length;
      if (cnt === 0) { alert('暂无过关词可重置'); return; }
      if (!confirm(`确定把 ${cnt} 个过关词全部放回训练池吗？（只清空"过关"标签，学习记录保留）`)) return;
      Object.keys(STORE.labels).forEach(k => {
        if (k.startsWith(cat + ':') && STORE.labels[k] === 'graduate') delete STORE.labels[k];
      });
      persist();
      route();
      break;
    }
    case 'flip':  flipCard(); break;
    case 'label': markLabel(el.dataset.label); break;
    case 'skip':  skipCard(); break;
    case 'speak': speakWord(el.dataset.word); break;
    case 'timer-pause': timerTogglePause(); break;
    case 'manual-export': manualExport(); break;
    case 'cloud-backup': cloudBackup(); break;
    case 'cloud-restore': cloudRestore(); break;
    case 'setup-autobackup': setupAutoBackup(); break;
        case 'profile-create': {
      const name = prompt('新用户名称：', '用户' + (getProfiles().length + 1));
      if (name && name.trim()) {
        const id = createProfile(name.trim());
        setActiveProfile(id);
        route();
      }
      break;
    }
    case 'profile-switch': {
      const id = el.dataset.id;
      const ps = getProfiles();
      const p = ps.find(x => x.id === id);
      if (!p || p.id === getActiveProfileId()) break;
      if (confirm(`切换到「${p.name}」？当前用户「${getActiveProfileName()}」的修改会自动保存。`)) {
        persist();
        setActiveProfile(id);
        route();
      }
      break;
    }
    case 'profile-rename': {
      const id = el.dataset.id;
      editingProfileId = id;
      route();
      // 自动聚焦到输入框 + 绑定键盘事件
      setTimeout(() => {
        const input = document.querySelector('.profile-rename-input');
        if (!input) return;
        input.focus();
        input.select();
        const finish = (save) => {
          if (save) {
            const nn = input.value.trim();
            if (nn) renameProfile(input.dataset.id, nn);
          }
          editingProfileId = null;
          route();
        };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); finish(true); }
          else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        });
        // blur 保存（100ms 延迟，避免和按钮点击冲突）
        input.addEventListener('blur', () => {
          setTimeout(() => {
            if (editingProfileId === input.dataset.id) finish(true);
          }, 100);
        });
      }, 0);
      break;
    }
    case 'profile-rename-save': {
      const id = el.dataset.id;
      const input = document.querySelector('.profile-rename-input');
      if (input && input.value.trim()) renameProfile(id, input.value.trim());
      editingProfileId = null;
      route();
      break;
    }
    case 'profile-rename-cancel': {
      editingProfileId = null;
      route();
      break;
    }
    case 'profile-delete': {
      const id = el.dataset.id;
      const ps = getProfiles();
      if (ps.length <= 1) { alert('至少要保留一个用户'); break; }
      const p = ps.find(x => x.id === id);
      if (!p) break;
      if (!confirm(`确定要删除用户「${p.name}」吗？\n该用户的所有学习记录将永久丢失！`)) break;
      deleteProfile(id);
      reloadStore();
      route();
      break;
    }
    case 'reset-active-profile': {
      const name = getActiveProfileName() || '默认用户';
      const ok = confirm(`确定要清空用户「${name}」的全部学习进度吗？\n\n将删除：标签、已学记录、打卡、查词本、短语与词缀记录。\n此操作不可恢复，建议先在上方备份。`);
      if (!ok) break;
      resetActiveProfileProgress();
      showToast('已清空当前用户的学习进度', 'success');
      route();
      break;
    }
    case 'backup-now': (async () => { const h = await getHandle(); if (h) { await doAutoBackup(h); route(); } })(); break;
    case 'import-backup': document.getElementById('import-file').click(); break;
  }
}

/**
 * 执行搜索：读取输入框 → 跨分类匹配 → 记录查词 → 渲染结果卡片
 * 结果卡片可直接打标签（同步到原分类）
 */
function doSearch() {
  const input = document.getElementById('search-input');
  const box = document.getElementById('search-result');
  if (!input || !box) return;
  const q = input.value.trim();
  if (!q) { box.innerHTML = ''; return; }

  const results = searchWord(q);
  if (results.length === 0) {
    box.innerHTML = `<div class="search-empty">❌ 词库未收录「${q}」（初中/高中/四级/六级/专业均无此词）</div>`;
    return;
  }

  // 每个匹配结果 count+1，收入查词本
  results.forEach(r => recordLookup(r.cat, r.word));

  // 渲染结果卡片（可直接打标签）
  box.innerHTML = results.map(r => {
    const catName = CATS[r.cat] ? CATS[r.cat].name : r.cat;
    const catColor = CATS[r.cat] ? CATS[r.cat].color : '#999';
    const lb = labelOf(r.cat, r.word);
    const lbText = lb
      ? `<span class="tag" style="background:${LABELS[lb].color}">${LABELS[lb].name}</span>`
      : '<span class="tag" style="background:#bbb">未标记</span>';
    const cnt = lookupCount(r.cat, r.word);
    const ph = r.phonetic ? `<small class="lookup-ph">/${r.phonetic}/</small>` : '';
    const labelBtns = LABEL_ORDER.map(l =>
      `<button class="label-btn" style="--c:${LABELS[l].color}" data-action="lookup-label" data-cat="${r.cat}" data-word="${r.word}" data-label="${l}">${LABELS[l].name}</button>`
    ).join('');
    return `
      <div class="search-card">
        <div class="search-head">
          <b>${r.word}</b> ${ph}
          <button class="speak-btn" data-action="speak" data-word="${r.word}" title="朗读">🔊</button>
          <span class="lookup-cat" style="color:${catColor}">📚 ${catName}</span>
          ${lbText}
          <small class="lookup-cnt">已查 ${cnt} 次</small>
        </div>
        <div class="search-meaning">${r.meaning || '—'}</div>
        ${r.example ? `<div class="example">${r.example}</div>` : ''}
        <div class="search-label-row">${labelBtns}</div>
      </div>`;
  }).join('');
}

// ===== 备份与恢复 =====
const BACKUP_DB = 'wordapp';                       // IndexedDB 库名
const BACKUP_STORE = 'handles';                    // 存 fileHandle 的 store
const AUTO_BACKUP_INTERVAL = 1 * 24 * 60 * 60 * 1000; // 1 天触发一次自动备份（保留最近 7 份）

/** 打开 IndexedDB（用于持久化 fileHandle，File System Access API 要求） */
function openBackupDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(BACKUP_DB, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(BACKUP_STORE)) db.createObjectStore(BACKUP_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/** 把授权后的 fileHandle 存入 IndexedDB（页面刷新后仍能恢复） */
async function saveHandle(handle) {
  const db = await openBackupDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readwrite');
    tx.objectStore(BACKUP_STORE).put(handle, 'autobackup');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/** 取出之前授权的 fileHandle（若存在） */
async function getHandle() {
  const db = await openBackupDB();
  return new Promise(resolve => {
    const tx = db.transaction(BACKUP_STORE, 'readonly');
    const req = tx.objectStore(BACKUP_STORE).get('autobackup');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

/** 收集当前全部学习数据，用于导出/备份 */
function collectData() {
  return {
    version: 1,
    exportTime: new Date().toISOString(),
    labels: STORE.labels,
    studied: STORE.studied,
    sessions: STORE.sessions,
    totals: STORE.totals,
    checkin: STORE.checkin,
    autoBackup: STORE.autoBackup,
    cursor: STORE.cursor,
    lookups: STORE.lookups,
    pLabels: STORE.pLabels,
    pStudied: STORE.pStudied,
    pSessions: STORE.pSessions,
    pTotals: STORE.pTotals,
    pCursor: STORE.pCursor,
    aLabels: STORE.aLabels,
    aStudied: STORE.aStudied,
    aSessions: STORE.aSessions,
    aTotals: STORE.aTotals,
    aCursor: STORE.aCursor,
    aWords: STORE.aWords
  };
}

/** 日期戳 YYYYMMDD，用于生成文件名 */
function dateStamp() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
}

/** 手动导出：触发浏览器下载，文件名带 manual 标识与日期 */
function manualExport() {
  const blob = new Blob([JSON.stringify(collectData(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wordapp-manual-${dateStamp()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`备份已导出：wordapp-manual-${dateStamp()}.json`, 'success');
}

/** 首次设置自动备份：让用户选一个备份目录并授权（Chrome 的 File System Access API 目录模式） */
async function setupAutoBackup() {
  if (!window.showDirectoryPicker) {
    showToast('当前浏览器不支持目录自动备份，请用 Chrome 浏览器，或使用「手动导出」。', 'error', 6000);
    return;
  }
  try {
    // 弹目录选择框，用户导航到"背单词备份"目录并选中授权
    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await saveHandle(dirHandle);
    STORE.autoBackup.handleReady = true;
    await doAutoBackup(dirHandle);
    showToast(`自动备份已设置到目录：${dirHandle.name}（每天一次，保留最近 7 份）`, 'success', 5000);
    persist();
    route();
  } catch (e) {
    if (e.name !== 'AbortError') console.error('设置自动备份失败:', e);
  }
}

/** 执行自动备份：在已授权目录里新建带时间戳的备份文件，并滚动删除最旧的（保留最近 7 份） */
async function doAutoBackup(dirHandle) {
  if (!dirHandle) return;
  try {
    // 校验目录读写权限（页面刷新后 Chrome 可能要求重新确认）
    const perm = await dirHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      const req = await dirHandle.requestPermission({ mode: 'readwrite' });
      if (req !== 'granted') return;
    }
    // 先更新 autoBackup.count/lastAuto（在 collectData 之前），确保备份文件内的数据自洽（count 含本次、lastAuto=本次）
    STORE.autoBackup.lastAuto = new Date().toISOString();
    STORE.autoBackup.count = (STORE.autoBackup.count || 0) + 1;
    // 生成带时分时间戳的文件名，避免同一天多次备份重名
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
    const fileName = `wordapp-autobackup-${stamp}.json`;
    // 在目录里创建新文件并写入
    const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(collectData(), null, 2));
    await writable.close();
    // 滚动删除：收集所有备份文件名，按时间戳排序，保留最近 7 份，删最旧的
    const backups = [];
    for await (const [name] of dirHandle.entries()) {
      if (name.startsWith('wordapp-autobackup-') && name.endsWith('.json')) backups.push(name);
    }
    backups.sort();
    while (backups.length > 7) {
      const oldest = backups.shift();
      try { await dirHandle.removeEntry(oldest); } catch (e) { console.warn('删除旧备份失败:', oldest, e); }
    }
    persist();
  } catch (e) {
    console.error('自动备份写入失败:', e);
  }
}

/** 启动时检查：距上次自动备份超过 1 天则触发一次 */
async function checkAutoBackup() {
  const handle = await getHandle();
  if (!handle) return;
  STORE.autoBackup.handleReady = true;
  const last = STORE.autoBackup.lastAuto ? new Date(STORE.autoBackup.lastAuto) : null;
  const now = new Date();
  if (!last || (now - last) >= AUTO_BACKUP_INTERVAL) {
    await doAutoBackup(handle);
  }
}

/** 导入备份文件：覆盖当前所有学习记录 */
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      // V1.20 老备份只有 labels 一个字段，所以不能要求 labels+studied 同时存在
      if (!data || (data.labels === undefined && data.studied === undefined && data.pLabels === undefined && data.aLabels === undefined)) {
        throw new Error('文件里没有学习记录数据');
      }

      // 记住当前 profile，导入完成后切回去
      const prevProfileId = getActiveProfileId();

      // 导入到独立的「导入数据」profile（已存在则复用，避免重复导入产生一堆 profile）
      const profiles = getProfiles();
      let targetProfileId = profiles.find(p => p.name === '导入数据')?.id;
      if (!targetProfileId) {
        targetProfileId = createProfile('导入数据');
      }

      // 临时切到目标 profile
      _rawSave(ACTIVE_PROFILE_KEY, targetProfileId);
      reloadStore();

      STORE.labels = data.labels;
      STORE.studied = data.studied;
      STORE.sessions = data.sessions || STORE.sessions;
      STORE.totals = data.totals || STORE.totals;
      STORE.checkin = data.checkin || STORE.checkin;
      if (data.autoBackup) STORE.autoBackup = data.autoBackup;
      if (data.cursor) STORE.cursor = data.cursor;
      if (data.lookups) STORE.lookups = data.lookups;
      if (data.pLabels) STORE.pLabels = data.pLabels;
      if (data.pStudied) STORE.pStudied = data.pStudied;
      if (data.pSessions !== undefined) STORE.pSessions = data.pSessions;
      if (data.pTotals !== undefined) STORE.pTotals = data.pTotals;
      if (data.pCursor !== undefined) STORE.pCursor = data.pCursor;
      // 词缀字段（vocab-pwa 才有）
      if (data.aLabels) STORE.aLabels = data.aLabels;
      if (data.aStudied) STORE.aStudied = data.aStudied;
      if (data.aSessions !== undefined) STORE.aSessions = data.aSessions;
      if (data.aTotals !== undefined) STORE.aTotals = data.aTotals;
      if (data.aCursor !== undefined) STORE.aCursor = data.aCursor;
      STORE.aWords = pruneAffixExampleRecords(data.aWords || {});

      persist();

      // 切回原 profile
      if (prevProfileId && prevProfileId !== targetProfileId) {
        _rawSave(ACTIVE_PROFILE_KEY, prevProfileId);
        reloadStore();
      }

      // 统计导入了多少词/短语/词缀
      const wordCount = Object.keys(data.labels || {}).length;
      const phraseCount = Object.keys(data.pLabels || {}).length;
      const affixCount = Object.keys(data.aLabels || {}).length;
      const parts = [`共导入 ${wordCount} 个单词`];
      if (phraseCount) parts.push(`${phraseCount} 个短语`);
      if (affixCount) parts.push(`${affixCount} 条词缀`);
      showToast(`导入成功，${parts.join('、')}。请到「用户管理」页切换到「导入数据」查看。`, 'success', 6000);

      route();
    } catch (e) {
      showToast('导入失败：' + e.message, 'error', 6000);
    }
  };
  reader.readAsText(file);
}

/** 注入联系邮箱到 footer（innerHTML 不执行 <script>，必须在 route() 后手动调用）*/
function updateContactEmail() {
  const el = document.getElementById('contact-email');
  if (!el) return;
  const u = 'hinewly', d = '163.com';
  const addr = u + '@' + d;
  el.innerHTML = '<a href="mailto:' + addr + '?subject=' + encodeURIComponent('背单词 PWA 反馈') + '">' + addr + '</a>';
}

async function refreshApp() {
  const btn = document.getElementById('refresh-app-btn');
  if (!btn) return;
  const original = btn.textContent;
  btn.textContent = '⏳';
  btn.disabled = true;
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    const url = new URL(location.href);
    url.searchParams.set('_t', String(Date.now()));
    location.replace(url);
  } catch (e) {
    showToast('刷新失败: ' + e.message, 'error', 6000);
    btn.textContent = original;
    btn.disabled = false;
  }
}

/** 词缀例词渲染（批量列表和逐卡学习共用） */
function affixExamplesHtml(a) {
  return `
    <div class="affix-examples">
      ${a.ex.map((e, i) => {
        const m = e.match(/^(.+?)\s*→\s*(.+)$/);
        if (m) {
          const [, root, derived] = m;
          let cnPair = null;
          if (a.exCn && a.exCn[i]) {
            const cm = a.exCn[i].match(/^(.+?)\s*→\s*(.+)$/);
            if (cm) cnPair = [cm[1].trim(), cm[2].trim()];
          }
          const rootHtml = '<span class="affix-ex-word"><span class="affix-ex-en">' + root + affixSpeakBtn(root) + affixWordTagBtn(root) + '</span>' + (cnPair ? '<span class="affix-ex-cn">' + cnPair[0] + '</span>' : '') + '</span>';
          const derivedHtml = '<span class="affix-ex-word"><span class="affix-ex-en">' + derived + affixSpeakBtn(derived) + affixWordTagBtn(derived) + '</span>' + (cnPair ? '<span class="affix-ex-cn">' + cnPair[1] + '</span>' : '') + '</span>';
          return '<div class="affix-ex"><span class="affix-ex-pair">' + rootHtml + '</span><span class="affix-ex-arrow">→</span><span class="affix-ex-pair">' + derivedHtml + '</span></div>';
        }
        let cnPlain = null;
        if (a.exCn && a.exCn[i]) cnPlain = a.exCn[i];
        const plainHtml = '<span class="affix-ex-word"><span class="affix-ex-en">' + e + affixSpeakBtn(e) + affixWordTagBtn(e) + '</span>' + (cnPlain ? '<span class="affix-ex-cn">' + cnPlain + '</span>' : '') + '</span>';
        return '<div class="affix-ex"><span class="affix-ex-pair">' + plainHtml + '</span></div>';
      }).join('')}
    </div>`;
}

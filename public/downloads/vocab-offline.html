<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <meta name="description" content="个人英语单词记忆 PWA · 初中/高中/四级 5125 词">
  <title>背单词 · 单机版</title>

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="背单词">

  <style>
/* ============================================================
   背单词 App 样式
   设计原则：简洁、清晰、大方，让人每天愿意打开
   ============================================================ */

:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --ink: #1d2233;
  --ink-soft: #6b7280;
  --line: #e8ebf2;
  --main: #4f7cff;
  --main-d: #3a63e8;
  --radius: 18px;
  --shadow: 0 6px 20px rgba(31, 41, 77, 0.06);
  --shadow-hover: 0 10px 28px rgba(31, 41, 77, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 620px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  /* 全面屏 iPhone PWA 全屏模式：避开刘海/灵动岛与底部横条 */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ===== 顶栏 ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar .brand { font-size: 20px; font-weight: 700; color: var(--main); }
.topbar .back {
  background: none; border: none; color: var(--ink-soft);
  font-size: 15px; cursor: pointer; padding: 6px 4px;
}
.topbar .progress-text { font-size: 14px; color: var(--ink-soft); }

.checkin {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, #fff3e0, #ffe0b2);
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font-weight: 600; color: #e65100;
}
.checkin .fire { font-size: 16px; }
.checkin small { font-weight: 400; color: #bf6000; font-size: 11px; margin-left: 2px; }

/* ===== 页面容器 ===== */
.page { padding: 20px; }

.hero { text-align: center; padding: 20px 0 24px; }
.hero h2 { font-size: 24px; margin-bottom: 6px; }
.hero p { color: var(--ink-soft); font-size: 14px; }

/* ===== 分类卡片 ===== */
.cat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  border-left: 5px solid var(--c);
}
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cat-ico { font-size: 24px; }
.cat-name { font-size: 20px; font-weight: 700; }
.cat-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); }

/* ===== 掌握度进度条 ===== */
.mastery { margin-top: 12px; }
.mastery-info { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 5px; }
.mastery-info b { font-size: 16px; }
.mastery-bar { position: relative; height: 8px; background: #ececec; border-radius: 4px; overflow: visible; }
.mastery-fill { height: 100%; border-radius: 4px; transition: width .4s ease, background .3s; }
.mastery-target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #333; opacity: .6; }
.mastery-sub { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }

/* ===== 开发计划页 markdown 渲染 ===== */
.devplan-body { text-align: left; font-size: 14px; line-height: 1.7; }
.devplan-body h1, .devplan-body h2, .devplan-body h3 { margin: 18px 0 8px; }
.devplan-body table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
.devplan-body th, .devplan-body td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
.devplan-body th { background: #f5f5f5; }
.devplan-body ul { padding-left: 22px; }
.devplan-body code { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.devplan-body hr { border: none; border-top: 1px solid #eee; margin: 16px 0; }

/* ===== 按钮 ===== */
.btn-main {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: var(--main);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-main:hover { background: var(--main-d); }
.btn-ghost {
  width: 100%;
  padding: 13px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 10px;
}
.btn-ghost:hover { border-color: var(--main); color: var(--main); }

/* ===== 数量选择 ===== */
.section-title { font-size: 14px; color: var(--ink-soft); margin: 20px 0 12px; }
.num-row { display: flex; gap: 10px; margin-bottom: 18px; }
.num-btn {
  flex: 1; padding: 16px 0; border: 1.5px solid var(--line);
  border-radius: 14px; background: var(--card); font-size: 16px;
  font-weight: 600; cursor: pointer; transition: .15s;
}
.num-btn:hover { border-color: var(--main); }
.num-btn.active { background: var(--main); color: #fff; border-color: var(--main); }
.unified-num-row .num-btn {
  background: #fff;
  border-color: #e5e7eb;
  color: #374151;
  box-shadow: none;
}
.unified-num-row .num-btn:hover {
  border-color: #a78bfa;
  color: #6d28d9;
  transform: translateY(-1px);
}
.unified-num-row .num-btn:active {
  transform: translateY(0);
}

/* 加量按钮：100 词（绿色渐变，状态不错冲刺用） */
.num-btn-pro {
  flex: 1; padding: 16px 0; border: none;
  border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  color: #fff;
  background: linear-gradient(180deg, #34d399 0%, #059669 100%);
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: transform .12s ease, box-shadow .12s ease;
}
.num-btn-pro:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(5, 150, 105, 0.45), inset 0 1px 0 rgba(255,255,255,0.3); }
.num-btn-pro:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(5, 150, 105, 0.35); }
.num-btn-pro.active { background: linear-gradient(180deg, #059669 0%, #047857 100%); box-shadow: 0 6px 14px rgba(5, 150, 105, 0.5), inset 0 1px 0 rgba(255,255,255,0.3); }

/* 爆量按钮：200 词（紫色渐变，状态爆棚专注爆发用） */
.num-btn-max {
  flex: 1; padding: 16px 0; border: none;
  border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  color: #fff;
  background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 100%);
  box-shadow: 0 4px 10px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: transform .12s ease, box-shadow .12s ease;
}
.num-btn-max:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255,255,255,0.3); }
.num-btn-max:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(124, 58, 237, 0.4); }
.num-btn-max.active { background: linear-gradient(180deg, #7c3aed 0%, #6d28d9 100%); box-shadow: 0 6px 14px rgba(124, 58, 237, 0.55), inset 0 1px 0 rgba(255,255,255,0.3); }

/* ===== 学习卡片 ===== */
.study { display: flex; flex-direction: column; align-items: center; }
.progress { height: 4px; background: var(--line); position: relative; }
.progress-bar { height: 100%; background: var(--main); transition: width .25s; }

.card {
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow);
  width: 100%;
  min-height: 340px;
  padding: 40px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  animation: pop .25s ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.card-word { font-size: 40px; font-weight: 800; letter-spacing: .5px; }
.card-word.small { font-size: 26px; color: var(--ink-soft); }
.phonetic { font-size: 16px; color: var(--ink-soft); font-style: italic; }

/* 🔊 发音按钮：圆形小按钮，紧贴音标下方，立体渐变 */
.speak-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: none; background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
  color: #fff; font-size: 22px; cursor: pointer;
  box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  transition: transform .12s ease, box-shadow .12s ease;
  margin: 8px auto 16px;
  display: flex; align-items: center; justify-content: center;
}
.speak-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255,255,255,0.35); }
.speak-btn:active { transform: translateY(0) scale(0.98); box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4); }

.meaning { font-size: 22px; font-weight: 600; line-height: 1.6; }
.example { font-size: 14px; color: var(--ink-soft); font-style: italic; padding: 0 12px; }

/* ===== 标签按钮 ===== */
.label-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 8px; }
.label-btns {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  margin-top: 16px;
}
.label-btns .label-btn {
  min-height: 52px;
  padding: 13px 16px;
  font-size: 15px;
  border-radius: 14px;
}
.label-btn {
  padding: 13px; border: none; border-radius: 12px;
  background: var(--c); color: #fff; font-size: 15px;
  font-weight: 600; cursor: pointer; opacity: .92; transition: .15s;
}
.label-btn:hover { opacity: 1; transform: scale(1.02); }
.label-btn.grad-btn { width: 100%; margin-top: 10px; font-size: 15px; }

/* ===== 复习勾选 ===== */
.checks { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.check {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px; background: var(--card); border-radius: 14px;
  border: 1.5px solid var(--line); cursor: pointer; font-size: 15px;
}
.check input { width: 18px; height: 18px; accent-color: var(--main); }
.check small { color: var(--ink-soft); margin-left: auto; }
.check:has(input:checked) { border-color: var(--main); background: #f0f4ff; }

/* ===== 学习卡片倒计时 ===== */
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 10px;
}
.timer-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.timer-circle {
  width: 52px;
  height: 52px;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.timer-circle svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
  overflow: visible;
}
.timer-circle .track {
  fill: none;
  stroke: #e8ecf5;
  stroke-width: 4;
}
.timer-circle .progress {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
  transition: stroke 0.3s, stroke-dashoffset 0.3s linear;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.08));
}
.timer-circle .progress.ok { stroke: #34c759; }     /* >60% 绿 */
.timer-circle .progress.warn { stroke: #f29a3d; }   /* 30-60% 黄 */
.timer-circle .progress.danger { stroke: #e74c3c; animation: pulse 1s infinite alternate; } /* <30% 红 */
@keyframes pulse {
  from { filter: drop-shadow(0 0 0 rgba(231,76,60,0)); }
  to   { filter: drop-shadow(0 0 5px rgba(231,76,60,.55)); }
}
.timer-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.2px;
}
.timer-pause-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: .15s;
}
.timer-pause-btn:hover { border-color: var(--main); color: var(--main); background: #eef3ff; }

/* ===== 结果页 ===== */
.result { text-align: center; }
.result-ico { font-size: 56px; margin-bottom: 10px; }
.result h2 { font-size: 24px; margin-bottom: 20px; }
.dist { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
.dist-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; font-size: 15px; }
.dist-row b { margin-left: auto; }
.btns { display: flex; flex-direction: column; }

/* ===== 统计页 ===== */
.stat-block { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.stat-block h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 14px; }
.stat-grid .v { font-weight: 700; color: var(--ink); }
.stat-grid .l { color: var(--ink-soft); }
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 13px; padding: 4px 10px; border-radius: 999px; color: #fff; font-weight: 500; }

/* ===== 查词 & 查词本 ===== */
.search-box { display: flex; gap: 8px; margin-bottom: 14px; }
.search-box input { flex: 1; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; font-size: 15px; outline: none; transition: border-color .2s; }
.search-box input:focus { border-color: var(--main); }
.search-btn { padding: 12px 20px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: 600; }
.search-btn:hover { background: var(--main-d); }

#search-result { margin-bottom: 18px; }
.search-card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--main); }
.search-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.search-head b { font-size: 20px; }
.search-head .tag { font-size: 12px; padding: 2px 8px; }
.lookup-cat { font-size: 13px; font-weight: 600; }
.lookup-cnt { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
.search-meaning { font-size: 15px; color: var(--ink); margin-bottom: 10px; }
.search-label-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.search-empty { background: #fff3f3; color: #e74c3c; padding: 12px 16px; border-radius: 12px; font-size: 14px; }

.lookup-card { border-left: 4px solid #6c5ce7; }
.lookup-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.lookup-row { background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.lookup-row.lookup-done { opacity: 0.5; }
.lookup-word { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.lookup-word b { font-size: 17px; }
.lookup-word .tag { font-size: 11px; padding: 2px 8px; }
.lookup-ph { color: var(--ink-soft); font-size: 13px; }
.lookup-meaning { font-size: 14px; color: var(--ink-soft); }
.lookup-meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.lookup-meta b { color: #e67e22; }
.lookup-info { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 10px 0; font-size: 13px; }
.lookup-info .tag { font-size: 12px; padding: 2px 8px; }
.hint { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.empty { text-align: center; color: var(--ink-soft); padding: 24px; }
.btn-ghost.danger { color: #e74c3c; border-color: #e74c3c; }

/* ===== 短语本 ===== */
.level-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.level-tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #f0f0f5; color: var(--ink-soft); }

/* ===== 多用户档案 ===== */
.profile-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  background: rgba(255,255,255,0.4);    /* 提高对比度：0.15 → 0.4 */
  color: #047857;                       /* 深绿色文字，对比绿底 */
  border-radius: 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  border: none;
  user-select: none;
}
.profile-chip:active { background: rgba(255,255,255,0.55); }
.profile-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-caret { font-size: 9px; opacity: 0.75; }

.back-btn {
  background: none;
  border: none;
  color: #374151;
  font-size: 14px;
  cursor: pointer;
  padding: 6px 8px;
}

.profile-intro {
  background: #ecfdf5;
  border-radius: 10px;
  padding: 12px 16px;
  margin: 12px 0;
  font-size: 13px;
  color: #065f46;
}
.profile-intro p { margin: 0; }

.profile-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 12px 0;
}
.profile-item {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.profile-item.active {
  border-color: #059669;
  background: #f0fdf4;
}
.profile-item-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
}
.profile-item-name {
  font-weight: 600;
  font-size: 16px;
  color: #111827;
}
.profile-badge {
  display: inline-block;
  background: #059669;
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 8px;
  margin-top: 4px;
}
.profile-item-date {
  color: #9ca3af;
  font-size: 12px;
}
.profile-item-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  color: #374151;
}
.btn-sm:active { background: #f3f4f6; }
.btn-sm.primary {
  background: #059669;
  color: white;
  border-color: #059669;
}
.btn-sm.danger {
  color: #dc2626;
  border-color: #fecaca;
}

.btn-primary {
  width: 100%;
  padding: 12px;
  background: #059669;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 16px;
}
.btn-primary:active { background: #047857; }

.contact-footer {
  margin-top: 24px;
  padding: 16px 12px;
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  border-top: 1px solid #e5e7eb;
}
.contact-footer a {
  color: #059669;
  text-decoration: none;
}

/* ===== 版本号徽章 + 刷新按钮（header） ===== */
.version-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 600;
  background: rgba(255,255,255,0.5);   /* 提高对比度 */
  color: #047857;                      /* 深绿色，对比绿底 */
  border-radius: 10px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  user-select: none;
  cursor: help;
}

.refresh-app-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: all 0.2s ease;

  <script>
'use strict';
/* ============================================================
   背单词 App 主逻辑
   功能：分类学习 / 加权随机抽词(强化记忆) / 4标签
        / 学习统计 / 按标签复习 / 连续打卡
   持久化：localStorage（标签、已学、轮数、打卡）
   ============================================================ */

// ===== 分类配置 =====
const CATS = {
  junior: { name: '初中', color: '#4f8cff', icon: '📘' },
  senior: { name: '高中', color: '#7c5cff', icon: '📗' },
  cet4:   { name: '四级', color: '#00a8a8', icon: '📘' },
  cet6:   { name: '六级', color: '#e84393', icon: '📕' },
  major:  { name: '专业', color: '#00b894', icon: '💻' }
};

// ===== 标签配置（权重越高越易被抽到，用于强化记忆）=====
const LABELS = {
  know:     { name: '认识',     color: '#34c759', weight: 0.3 },
  fuzzy:    { name: '模糊',     color: '#f5a623', weight: 3 },
  key:      { name: '重点',     color: '#ff6b35', weight: 4 },
  must:     { name: '必背',     color: '#e74c3c', weight: 5 },
  graduate: { name: '过关',     color: '#4f7cff', weight: 0 }
};
const LABEL_ORDER = ['know', 'fuzzy', 'key', 'must', 'graduate'];

// ===== 免费试学 / 付费解锁（轻量防护，防君子不防小人） =====
// 激活码验证走 Cloudflare Worker 后端（6位纯数字，软绑定最多3台设备）
const UNLOCK_API_BASE = 'https://daobox.app';
const UNLOCK_API = UNLOCK_API_BASE + '/api/activate';
const ORDER_API = UNLOCK_API_BASE + '/api/order';
const UNLOCK_KEY = 'wa:unlocked';
const DEVICE_ID_KEY = 'wa:device_id';

function getDeviceId() {
  try {
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if (!id) {
      id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  } catch (e) {
    return 'anon-' + Math.random().toString(36).slice(2, 10);
  }
}

async function submitUnlock(rawCode) {
  const code = String(rawCode || '').replace(/\D/g, '');
  if (code.length !== 6) {
    showToast('请输入 6 位数字激活码', 'error');
    return;
  }
  try {
    const res = await fetch(UNLOCK_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, deviceId: getDeviceId(), projectId: window.VOCAB_OFFLINE ? 'vocab_offline' : undefined }),
    });
    const data = await res.json().catch(() => ({}));
    if (data.ok) {
      localStorage.setItem(UNLOCK_KEY, '1');
      showToast('解锁成功，全部词本已开放', 'success');
      location.hash = '#/';
    } else {
      showToast(data.error || '激活失败，请稍后再试', 'error');
    }
  } catch (e) {
    showToast('网络异常，请检查网络后重试', 'error');
  }
}

async function submitOrder(contact) {
  try {
    const res = await fetch(ORDER_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact }),
    });
    const data = await res.json().catch(() => ({}));
    if (data.ok && data.checkUrl) {
      showToast('登记成功！请保存打开的取码页', 'success');
      window.open(data.checkUrl, '_blank');
      return true;
    }
    showToast(data.error || '登记失败，请稍后再试', 'error');
  } catch (e) {
    showToast('网络异常，请稍后再试', 'error');
  }
  return false;
}
const TRIAL_LIMITS = { senior: 300, cet4: 100, cet6: 100, major: 100 };
function isUnlocked() {
  try {
    if (localStorage.getItem(UNLOCK_KEY) === '1') return true;
    // 2026-10 策略：登录 DaoBox 账号即免费解锁全部词库（激活码通道保留）
    return !!localStorage.getItem('daobox_token');
  } catch (e) { return false; }
}
function accessibleWords(cat) {
  const list = window.WORDS[cat] || [];
  if (cat === 'junior' || isUnlocked()) return list;
  const limit = TRIAL_LIMITS[cat];
  return limit ? list.slice(0, limit) : list;
}
function isWordAccessible(cat, word) {
  if (cat === 'junior' || isUnlocked()) return true;
  const limit = TRIAL_LIMITS[cat];
  if (!limit) return true;
  const idx = (window.WORDS[cat] || []).findIndex(w => w.word === word);
  return idx !== -1 && idx < limit;
}

/** 应用版本号 · 每次发版 bump（跟 service-worker.js CACHE_VERSION 同步）*/
const APP_VERSION = 'v1.2.21';

/** 紧凑卡模板：所有首页卡片统一风格 */
function compactCard(opts) {
  const { icon, name, color, action, dataAttrs = '', badge, badgeColor, progress, progressColor, footer, className = '' } = opts;
  return `
    <div class="cat-card ${className}" data-action="${action}" ${dataAttrs} style="--c:${color}">
      <div class="cat-head">
        <span class="cat-ico">${icon}</span>
        <span class="cat-name">${escapeHtml(name)}</span>
        ${badge ? `<span class="cat-pct-badge" style="background:${badgeColor || color}">${escapeHtml(badge)}</span>` : ''}
      </div>
      ${progress !== undefined ? `
      <div class="mastery-bar-wrap">
        <div class="mastery-bar">
          <div class="mastery-fill" style="width:${progress}%;background:${progressColor || color}"></div>
        </div>
      </div>` : ''}
      ${footer ? `<div class="cat-foot"><small>${escapeHtml(footer)}</small></div>` : ''}
    </div>`;
}

// ===== 存储读写 =====
// 原始读写（不经过 profile 前缀，给档案管理自己用）
function _rawLoad(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function _rawSave(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

/** HTML 转义（防止用户输入的档案名带特殊字符破坏 DOM）*/
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
// ===== Toast 通知（非阻塞，右下角，自动消失）=====
function showToast(msg, type = 'info', duration = 4000) {
  let wrap = document.getElementById('toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    el.addEventListener('transitionend', () => el.remove(), { once: true });
  }, duration);
}


// ===== 多用户档案管理 =====
const PROFILES_KEY = 'wa:profiles';
const ACTIVE_PROFILE_KEY = 'wa:active-profile';
const MIGRATED_KEY = 'wa:migrated-v2';
const STATE_KEYS = ['labels', 'studied', 'sessions', 'totals', 'checkin', 'autoBackup', 'cursor', 'lookups', 'p-labels', 'p-studied', 'p-sessions', 'p-totals', 'p-cursor', 'a-labels', 'a-studied', 'a-sessions', 'a-totals', 'a-cursor', 'a-words'];

function getProfiles() { return _rawLoad(PROFILES_KEY, []); }
function saveProfiles(p) { _rawSave(PROFILES_KEY, p); }
function getActiveProfileId() {
  const ps = getProfiles();
  const aid = _rawLoad(ACTIVE_PROFILE_KEY, null);
  if (aid && ps.some(p => p.id === aid)) return aid;
  return ps[0]?.id || null;
}
function getActiveProfileName() {
  const id = getActiveProfileId();
  if (!id) return null;
  return getProfiles().find(p => p.id === id)?.name || null;
}
function profileKey(key) {
  const id = getActiveProfileId();
  return id ? key.replace(/^wa:/, `wa:${id}:`) : key;
}
function createProfile(name) {
  const ps = getProfiles();
  const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  ps.push({ id, name: name || '新用户', createdAt: Date.now() });
  saveProfiles(ps);
  return id;
}
function renameProfile(id, newName) {
  const ps = getProfiles();
  const p = ps.find(x => x.id === id);
  if (p) { p.name = newName; saveProfiles(ps); }
}
function deleteProfile(id) {
  const ps = getProfiles().filter(p => p.id !== id);
  saveProfiles(ps);
  STATE_KEYS.forEach(k => localStorage.removeItem(`wa:${id}:${k}`));
  if (_rawLoad(ACTIVE_PROFILE_KEY, null) === id) {
    const na = ps[0]?.id;
    if (na) _rawSave(ACTIVE_PROFILE_KEY, na);
    else localStorage.removeItem(ACTIVE_PROFILE_KEY);
  }
}
let editingProfileId = null;  // 行内编辑：当前在改名的 profile id

function setActiveProfile(id) {
  _rawSave(ACTIVE_PROFILE_KEY, id);
  reloadStore();
}
function reloadStore() {
  STORE.labels    = load('wa:labels', {});
  STORE.studied   = load('wa:studied', {});
  STORE.sessions  = load('wa:sessions', defaultsByCat());
  STORE.totals    = load('wa:totals',   defaultsByCat());
  STORE.checkin   = load('wa:checkin',  { streak: 0, lastDate: '', dates: [] });
  STORE.autoBackup= load('wa:autoBackup',{ lastAuto: '', count: 0, handleReady: false });
  STORE.cursor    = load('wa:cursor',   defaultsByCat());
  STORE.lookups   = load('wa:lookups', {});
  STORE.pLabels   = load('wa:p-labels', {});
  STORE.pStudied  = load('wa:p-studied', {});
  STORE.pSessions = load('wa:p-sessions', 0);
  STORE.pTotals   = load('wa:p-totals',  0);
  STORE.pCursor   = load('wa:p-cursor',  0);
  STORE.aLabels   = load('wa:a-labels', {});
  STORE.aStudied  = load('wa:a-studied', {});
  STORE.aSessions = load('wa:a-sessions', 0);
  STORE.aTotals   = load('wa:a-totals',  0);
  STORE.aCursor   = load('wa:a-cursor',  0);
  STORE.aWords    = pruneAffixExampleRecords(load('wa:a-words', {}));
}

/** 清空当前用户的学习进度；保留用户档案与自动备份设置 */
function resetActiveProfileProgress() {
  STORE.labels    = {};
  STORE.studied   = {};
  STORE.sessions  = defaultsByCat();
  STORE.totals    = defaultsByCat();
  STORE.checkin   = { streak: 0, lastDate: '', dates: [] };
  STORE.cursor    = defaultsByCat();
  STORE.lookups   = {};
  STORE.pLabels   = {};
  STORE.pStudied  = {};
  STORE.pSessions = 0;
  STORE.pTotals   = 0;
  STORE.pCursor   = 0;
  STORE.aLabels   = {};
  STORE.aStudied  = {};
  STORE.aSessions = 0;
  STORE.aTotals   = 0;
  STORE.aCursor   = 0;
  STORE.aWords    = {};
  session = null;
  persist();
}

// 一次性迁移：老数据 (wa:labels 等无前缀) → "用户1"档案
function migrateToProfiles() {
  if (_rawLoad(MIGRATED_KEY, false)) return;
  const hasOld = STATE_KEYS.some(k => localStorage.getItem(`wa:${k}`) !== null);
  if (hasOld) {
    const id = createProfile('用户1');
    STATE_KEYS.forEach(k => {
      const v = localStorage.getItem(`wa:${k}`);
      if (v !== null) {
        localStorage.setItem(`wa:${id}:${k}`, v);
        localStorage.removeItem(`wa:${k}`);
      }
    });
    _rawSave(ACTIVE_PROFILE_KEY, id);
  } else {
    const id = createProfile('默认用户');
    _rawSave(ACTIVE_PROFILE_KEY, id);
  }
  _rawSave(MIGRATED_KEY, true);
}
migrateToProfiles();

// 应用层 load/save：自动加 profile 前缀
function load(key, def) { return _rawLoad(profileKey(key), def); }
function save(key, val) { _rawSave(profileKey(key), val); }

/** 根据 WORDS 动态生成分类默认值对象，新增分类时自动适配，无需改代码 */
function defaultsByCat() {
  const cats = Object.keys(window.WORDS || {});
  const obj = {};
  for (const c of cats) obj[c] = 0;
  return obj;
}

const STORE = {
  labels:   load('wa:labels', {}),                                  // { "cat:word": "know|fuzzy|key|must|graduate" }
  studied:  load('wa:studied', {}),                                 // { "cat:word": 练习次数 }
  sessions: load('wa:sessions', defaultsByCat()),                    // 每分类完成轮数
  totals:   load('wa:totals',   defaultsByCat()),                    // 每分类累计练习词数
  checkin:  load('wa:checkin', { streak: 0, lastDate: '', dates: [] }),
  autoBackup: load('wa:autobackup', { lastAuto: '', count: 0, handleReady: false }), // 自动备份状态

function wordKey(cat, word) { return cat + ':' + word; }

/** 取某词的抽取权重 */
function weightOf(cat, word) {
  const l = labelOf(cat, word);

// ===== 掌握度 =====
/** 各分类目标掌握度（百分比） */
const TARGETS = { junior: 99, senior: 95, cet4: 90, cet6: 90, major: 95 };
/** 掌握度颜色分档：<50红 / 50-70橙 / 70-85黄 / 85-95蓝 / ≥95绿 */
function masteryColor(pct) {
  if (pct < 50) return '#e74c3c';
  if (pct < 70) return '#e67e22';
  if (pct < 85) return '#f1c40f';
  if (pct < 95) return '#3498db';
  return '#2ecc71';
}
/** 掌握度档位文字 */
function masteryLabel(pct) {
  if (pct < 50) return '起步';
  if (pct < 70) return '过半';
  if (pct < 85) return '良好';
  if (pct < 95) return '优秀';
  return '精通';
}
/** 计算某分类掌握度百分比 = (过关词 + 认识词) / 总词数 × 100 */
function masteryOf(cat) {
  const total = catCount(cat);
  if (total === 0) return 0;
  const lb = countLabels(cat);
  return Math.round((lb.graduate + lb.know) / total * 1000) / 10; // 保留一位小数
}

// ===== 抽词逻辑 =====
/**
 * 游标顺序推进抽词：优先未学过的词，按游标顺序取，绝不回头
 * 未学词按语料频次降序排列，游标每次前进 n，不重叠不跳段
 * 游标到末尾后回到 0 重新扫（此时未学池已因过关/标签变小，剩余少量继续扫）
 * 未学词不足 n 时，用加权随机从已学词补充（含必背/重点强化）
 * 已过关（标"过关"）的词不参与抽词
 * @param cat 分类
 * @param n 数量
 */
function pickWords(cat, n) {
  // 过滤掉已过关（标"过关"）的词
  const list = accessibleWords(cat).filter(w => labelOf(cat, w.word) !== 'graduate');
  if (list.length === 0) return [];

  // 拆分：未学过 vs 已学过
  // 注意：不在此处 sort！data.js 里的词已按 hit 排序（hit:true 在前），
  // 每次 sort 会打乱 hit 相同词的相对顺序，导致游标指向的位置对应不同的词 → 重复抽词
  const unlearned = list.filter(w => !STORE.studied[wordKey2(cat, w.word)]);
  const learned   = list.filter(w =>  STORE.studied[wordKey2(cat, w.word)]);

  // 初始化游标（防未定义）
  if (typeof STORE.cursor[cat] !== 'number' || STORE.cursor[cat] < 0) STORE.cursor[cat] = 0;
  // 游标超出当前未学池长度时归零重扫
  if (STORE.cursor[cat] >= unlearned.length) STORE.cursor[cat] = 0;

  const take = Math.min(n, unlearned.length);
  // 从游标位置开始取连续 take 个；若到末尾不够则回绕从头补够（极少发生）
  const result = [];
  if (unlearned.length > 0) {
    let i = STORE.cursor[cat];
    while (result.length < take) {
      result.push(unlearned[i]);
      i++;
      if (i >= unlearned.length) i = 0;
    }
    // 游标前进 take（模未学池长度，下次进来长度可能已变小）
    STORE.cursor[cat] = (STORE.cursor[cat] + take) % Math.max(1, unlearned.length);
  }

  // 不足 n 时，用加权随机从已学词补充
  if (result.length < n && learned.length > 0) {
    const used = new Set(result.map(w => w.word));
    while (result.length < n && used.size < learned.length) {
      const cand = learned.filter(w => !used.has(w.word));
      const total = cand.reduce((s, w) => s + weightOf(cat, w.word), 0);
      let r = Math.random() * total;
      let picked = cand[0];
      for (const w of cand) { r -= weightOf(cat, w.word); if (r <= 0) { picked = w; break; } }
      used.add(picked.word);
      result.push(picked);
    }
  }
  persist(); // 保存游标
  return result;
}

/** 构造存储 key 形式 "cat:word" */
function wordKey2(cat, word) { return cat + ':' + word; }

/**
 * 按标签筛选抽词（复习模式）
 */
function pickByLabels(cat, labels, n) {
  const list = accessibleWords(cat).filter(w => {
    const l = labelOf(cat, w.word);
    return l && labels.includes(l);
  });
  const shuffled = list.slice().sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

// ===== 查词 & 查词本 =====
/**
 * 跨 5 个分类搜索单词，返回所有匹配结果（精确匹配，大小写不敏感）
 * @param {string} word - 要搜索的单词
 * @returns {Array<{cat, word, phonetic, meaning, example}>} 匹配结果列表
 */
function searchWord(word) {
  const q = (word || '').trim().toLowerCase();
  if (!q) return [];
  const results = [];
  Object.keys(CATS).forEach(cat => {
    const list = accessibleWords(cat);
    for (const w of list) {
      if (w.word.toLowerCase() === q) {
        results.push({ cat, word: w.word, phonetic: w.phonetic, meaning: w.meaning, example: w.example });
        break; // 同分类内不会有重复，找到即停
      }
    }
  });
  return results;
}

/**
 * 记录一次查词：count+1，更新 lastAt，自动收入查词本
 * @param {string} cat - 分类
 * @param {string} word - 单词
 */
function recordLookup(cat, word) {
  const k = wordKey(cat, word);
  const old = STORE.lookups[k] || { count: 0, lastAt: 0 };
  STORE.lookups[k] = { count: old.count + 1, lastAt: Date.now() };
  persist();
}

/** 取某词的查词次数 */
function lookupCount(cat, word) {
  const k = wordKey(cat, word);
  return (STORE.lookups[k] && STORE.lookups[k].count) || 0;
}

/** 查词本总词数 */
function lookupTotal() { return Object.keys(STORE.lookups).length; }

/**
 * 从查词本抽词练习（按查词次数降序，所有词都可复习/改标签）
 * @param {number} n - 抽取数量
 * @returns {Array} 单词对象数组
 */
function pickFromLookups(n) {
  // 1. 收集所有查过的词，附带 count
  const items = Object.keys(STORE.lookups).map(k => {
    const [cat, ...rest] = k.split(':');
    const word = rest.join(':');
    return { cat, word, count: STORE.lookups[k].count };
  });
  // 只允许复习当前可访问的词
  const accessibleItems = items.filter(it => isWordAccessible(it.cat, it.word));
  // 2. 按查词次数降序排列（查得越多越先练，不管什么标签都可复习/改标签）
  accessibleItems.sort((a, b) => b.count - a.count);
  // 3. 取前 n 个，还原为 WORDS 里的完整对象
  const take = accessibleItems.slice(0, n);
  return take.map(it => {
    const w = (window.WORDS[it.cat] || []).find(x => x.word === it.word);
    return w ? { ...w, _cat: it.cat, _lookupCount: it.count } : null;
  }).filter(Boolean);
}

async function cloudRestore() {
  if (!window.DaoBox || !DaoBox.getToken()) {
    showToast('请先登录 DaoBox 账号', 'error');
    if (window.DaoBox) location.href = DaoBox.loginUrl();
    return;
  }
  if (!confirm('将从云端恢复并覆盖当前全部学习进度，继续？')) return;
  try {
    const r = await fetch('https://daobox.app/api/backup', {
      headers: { Authorization: 'Bearer ' + DaoBox.getToken() },
    });
    const d = await r.json().catch(() => ({}));
    if (!d.ok || !d.data) { showToast(d.data === null ? '云端还没有备份记录' : (d.error || '恢复失败'), 'error'); return; }
    const data = JSON.parse(d.data);
    const stale = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('wa:')) stale.push(k);
    }
    stale.forEach(k => localStorage.removeItem(k));
    Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, v));
    showToast('恢复成功，正在刷新…', 'success');
    setTimeout(() => location.reload(), 800);
  } catch (e) { showToast('网络异常，请稍后再试', 'error'); }

// ===== 当前学习会话（内存）=====
let session = null;
let reviewSel = { labels: new Set(), n: 20 };

/** 初始化一次学习会话 */
function startSession(cat, words) {
  session = { cat, words, idx: 0, flipped: false, labels: {} };
  // 启动时重置倒计时（短语用 12s/条，单词用 8s/条）
  const secPer = (cat === 'phrase') ? SEC_PER_PHRASE : SEC_PER_WORD;
  timerReset(words.length, secPer);
}

// ===== 倒计时（紧迫感 · 默认 3s/词）=====
const SEC_PER_WORD = 8;        // 默认每词 8 秒（首遍过单词表时节奏较宽松，后续熟悉可下调到 5s/3s）
const SEC_PER_PHRASE = 12;     // 短语每条 12 秒（短语需要多看一眼，比单词更宽）
const TIMER_CIRC = 2 * Math.PI * 22;  // SVG 圆环周长（r=22）
let timer = {
  totalMs: 0,        // 目标总时长（毫秒）
  remainMs: 0,       // 剩余毫秒
  startedAt: 0,      // 本次计时开始的时间戳（用于切页暂停校正）
  paused: false,     // 是否手动暂停
  autoPaused: false, // 是否因切页面自动暂停
  elapsedAtStart: 0, // 会话开始时已过去的总时间
  id: null,          // setInterval id
  totalElapsed: 0    // 本轮实际花费的总毫秒（用于结果页）
};

/** 按词数重置倒计时并启动 */
function timerReset(wordCount, secPer) {
  timerStop();
  secPer = secPer || SEC_PER_WORD;
  const total = Math.max(10, wordCount * secPer) * 1000;
  timer.totalMs = total;
  timer.remainMs = total;
  timer.startedAt = Date.now();
  timer.elapsedAtStart = 0;
  timer.totalElapsed = 0;
  timer.paused = false;
  timer.autoPaused = false;
  timer.id = setInterval(timerTick, 250);
}

/** 停止并清空定时器 */
function timerStop() {
  if (timer.id) { clearInterval(timer.id); timer.id = null; }
}

/** 每 250ms 推进倒计时一次 */
function timerTick() {
  if (timer.paused || timer.autoPaused) return;
  const now = Date.now();
  timer.remainMs -= (now - timer.startedAt);
  timer.startedAt = now;
  if (timer.remainMs <= 0) {
    timer.remainMs = 0;
    // 时间到：累计实际用时 = 目标时间（到点了）
    timer.totalElapsed += timer.totalMs;
    timerStop();
    // 时间到：剩余词不算学过，跳结果页
    const done = Object.keys(session.labels).reduce((s, k) => s + (session.labels[k] || 0), 0);
    const total = session.words.length;
    alert(`⏱ 时间到！\n\n已完成 ${done} / ${total} 个词\n剩余 ${total - done} 个词不算学过，下次还会遇到。`);
    // 直接跳结果页（不调用 advance，不记 sessions 增量）
    persist();
    checkAutoBackup();
    location.hash = '#/result/' + session.cat;
    return;
  }
  // 更新 DOM 显示
  const el = document.getElementById('timer-circle');
  if (el) timerRender();
}

/** 把剩余时间格式化成 00:12 / 01:05 字符串 */
function fmtTime(ms) {
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}

/** 渲染圆环进度 + 数字 + 颜色 */
function timerRender() {
  const ratio = timer.totalMs > 0 ? timer.remainMs / timer.totalMs : 1;
  const cls = ratio > 0.6 ? 'ok' : ratio > 0.3 ? 'warn' : 'danger';
  const offset = TIMER_CIRC * (1 - ratio);
  const html = `
    <svg viewBox="0 0 52 52" aria-hidden="true">
      <circle class="track" cx="26" cy="26" r="22"></circle>
      <circle class="progress ${cls}" cx="26" cy="26" r="22"
              stroke-dasharray="${TIMER_CIRC.toFixed(2)}"
              stroke-dashoffset="${offset.toFixed(2)}"></circle>
    </svg>
    <div class="timer-text">${fmtTime(timer.remainMs)}</div>`;
  const el = document.getElementById('timer-circle');
  if (el) el.innerHTML = html;
  // 同步暂停按钮文本
  const pb = document.getElementById('timer-pause-btn');
  if (pb) pb.textContent = (timer.paused || timer.autoPaused) ? '▶' : '⏸';
}

/** 手动暂停 / 继续 */
function timerTogglePause() {
  if (!timer.id) return;
  if (!timer.paused && !timer.autoPaused) {
    // 暂停
    timer.paused = true;
  } else if (timer.paused) {
    // 恢复
    timer.paused = false;
    timer.startedAt = Date.now();
  } else {
    // autoPaused 恢复
    timer.autoPaused = false;
    timer.startedAt = Date.now();
  }
  timerRender();
}

/** 切页面可见性：隐藏时自动暂停，可见时恢复 */
function timerOnVisibility() {
  if (!session || !timer.id) return;
  if (document.hidden) {
    if (!timer.paused && !timer.autoPaused) timer.autoPaused = true;
  } else {
    if (timer.autoPaused) {
      timer.autoPaused = false;
      timer.startedAt = Date.now();
      timerRender();
    }
  }
}

/** 短语存储 key 形式 "phrase:短语原文" */

/** 词缀相关辅助 */
function affixAll() {
  // 合并 prefix + suffix，每条带 type 标记
  const ps = (window.AFFIXES || {}).prefix || [];
  const sf = (window.AFFIXES || {}).suffix || [];
  return [...ps.map(a => ({ ...a, type: 'prefix' })), ...sf.map(a => ({ ...a, type: 'suffix' }))];
}
function affixKey(item) { return 'affix:' + item.type + ':' + item.a; }
function affixTotal() { return affixAll().length; }
function affixCountLabels() {
  const r = { know: 0, fuzzy: 0, key: 0, must: 0, graduate: 0 };
  Object.keys(STORE.aLabels).forEach(k => {
    const l = STORE.aLabels[k];
    if (r[l] !== undefined) r[l]++;
  });
  return r;
}
function affixStudiedCount() {
  return Object.keys(STORE.aStudied).filter(k => k.startsWith('affix:')).length;
}
function affixLabelOf(item) { return STORE.aLabels[affixKey(item)]; }
let affixSession = { list: [], idx: 0, current: null, showing: true };
let affixBatch = { list: [], mode: 'affix', wordFilter: 'all' };
let affixWordsFilter = 'all';

function normalizeWordKey(word) {
  return String(word || '').trim().toLowerCase().replace(/^[^a-z'-]+|[^a-z'-]+$/g, '');
}

let mainWordIndex = null;

function buildMainWordIndex() {
  const index = new Map();
  Object.keys(window.WORDS || {}).forEach(cat => {
    (window.WORDS[cat] || []).forEach(item => {
      const key = normalizeWordKey(item.word);
      if (!key) return;
      if (!index.has(key)) index.set(key, []);
      index.get(key).push({ cat, item });
    });
  });
  return index;
}

function mainWordMatches(word) {
  const key = normalizeWordKey(word);
  if (!key) return [];
  if (!mainWordIndex) mainWordIndex = buildMainWordIndex();
  return mainWordIndex.get(key) || [];
}

function affixExampleItems(a) {
  const out = [];
  (a.ex || []).forEach((e, i) => {
    const enParts = String(e || '').split(/\s*→\s*/).map(normalizeWordKey).filter(Boolean);
    const cnParts = String((a.exCn || [])[i] || '').split(/\s*→\s*/).map(x => x.trim()).filter(Boolean);
    enParts.forEach((word, idx) => {
      out.push({
        key: word,
        word,
        meaning: cnParts[idx] || cnParts[cnParts.length - 1] || '',
        affix: a.a,
        affixKey: affixKey(a),
        affixType: a.type
      });
    });
  });
  return out;
}

function affixExampleItemsForAffixes(list) {
  const map = new Map();
  (list || []).forEach(a => {
    affixExampleItems(a).forEach(it => {
      const old = map.get(it.key);
      if (old) {
        if (!old.affixes.includes(it.affix)) old.affixes.push(it.affix);
      } else {
        map.set(it.key, { ...it, affixes: [it.affix] });
      }
    });
  });
  return [...map.values()];
}

function affixWordState(word) {
  const key = normalizeWordKey(word);
  const matches = mainWordMatches(word);
  if (matches.length) {
    const first = matches[0];
    let label = '';
    matches.forEach(({ cat, item }) => {
      if (!label) label = STORE.labels[wordKey(cat, item.word)] || '';
    });
    return {
      key,
      word: first.item.word || key,
      meaning: first.item.meaning || '',
      phonetic: first.item.phonetic || '',
      isNew: false,
      existsIn: matches.map(m => m.cat),
      label,
      record: null
    };
  }
  const record = STORE.aWords[key] || null;
  return {
    key,
    word: record?.word || key,
    meaning: record?.meaning || '',
    phonetic: record?.phonetic || '',
    isNew: true,
    existsIn: [],
    label: record?.label || '',
    record
  };
}

function affixExampleStatesForAffixes(list) {
  return affixExampleItemsForAffixes(list).map(it => ({ ...it, ...affixWordState(it.word) }));
}

function allAffixExampleStates() {
  // 只显示“用户主动标记过”的例词；未标记例词只是词缀卡里的展示内容，不进入词库。
  const examples = affixExampleItemsForAffixes(affixAll());
  const map = new Map();
  examples.forEach(it => {
    const st = { ...it, ...affixWordState(it.word) };
    if (st.label) map.set(st.key, st);
  });

  Object.keys(STORE.aWords || {}).forEach(key => {
    const rec = STORE.aWords[key] || {};
    if (!rec.label || map.has(key)) return;
    const st = affixWordState(rec.word || key);
    map.set(key, {
      key,
      word: rec.word || key,
      meaning: st.meaning || rec.meaning || '',
      phonetic: st.phonetic || rec.phonetic || '',
      affixes: Array.isArray(rec.affixes) ? rec.affixes : [],
      isNew: st.isNew,
      existsIn: st.existsIn,
      label: st.label,
      record: st.record
    });
  });
  return [...map.values()];
}

function filterAffixExampleStates(states, filter) {
  if (filter === 'new') return states.filter(x => x.isNew);
  if (filter === 'main') return states.filter(x => !x.isNew);
  if (filter === 'unmarked') return states.filter(x => !x.label);
  if (filter === 'fuzzy') return states.filter(x => x.label === 'fuzzy');
  if (filter === 'key') return states.filter(x => x.label === 'key');
  if (filter === 'must') return states.filter(x => x.label === 'must');
  if (filter === 'graduate') return states.filter(x => x.label === 'graduate');
  return states;
}

function affixExampleStats() {
  const states = allAffixExampleStates();
  return {
    total: states.length,
    newCount: states.filter(x => x.isNew).length,
    mainCount: states.filter(x => !x.isNew).length,
    reviewable: states.filter(x => ['fuzzy', 'key', 'must'].includes(x.label)).length,
    graduate: states.filter(x => x.label === 'graduate').length
  };
}

function pruneAffixExampleRecords(records) {
  return Object.fromEntries(
    Object.entries(records || {}).filter(([, rec]) => !!rec?.label)
  );
}

function findAffixExampleItem(word) {
  const key = normalizeWordKey(word);
  return affixExampleItemsForAffixes(affixAll()).find(item => item.key === key) || null;
}

function setAffixExampleWordLabel(word, label, context = null) {
  const key = normalizeWordKey(word);
  if (!key || !LABELS[label]) return;
  const item = context || findAffixExampleItem(word);
  const matches = mainWordMatches(word);
  if (matches.length) {
    // 已在主词库：不重复建词本，标签写回原词库。
    matches.forEach(({ cat, item: wordItem }) => {
      STORE.labels[wordKey(cat, wordItem.word || word)] = label;
    });
  } else {
    // 新词：只有用户主动打标签时才保存。
    const affix = item?.affix || (Array.isArray(item?.affixes) ? item.affixes[0] : '');
    const rec = STORE.aWords[key] || {
      word: item?.word || key,
      meaning: item?.meaning || '',
      affixes: [],
      source: 'affix-example',
      label: '',
      studied: 0,
      firstSeenAt: Date.now()
    };
    if (!rec.word) rec.word = item?.word || key;
    if (!rec.meaning && item?.meaning) rec.meaning = item.meaning;
    if (!Array.isArray(rec.affixes)) rec.affixes = [];
    if (affix && !rec.affixes.includes(affix)) rec.affixes.push(affix);
    rec.source = 'affix-example';
    rec.label = label;
    rec.studied = (rec.studied || 0) + 1;
    STORE.aWords[key] = rec;
  }
  persist();
}

function clearAffixExampleWordLabel(word) {
  const key = normalizeWordKey(word);
  if (!key) return;
  const matches = mainWordMatches(word);
  if (matches.length) {
    matches.forEach(({ cat, item }) => {
      delete STORE.labels[wordKey(cat, item.word || word)];
    });
  }
  // 未标记的新词不继续占用“例词本”。
  if (STORE.aWords[key] && STORE.aWords[key].source === 'affix-example') {
    delete STORE.aWords[key];
  }
  persist();
}

function pickAffixExampleWords(labels = ['fuzzy', 'key', 'must'], n = 20) {
  const want = new Set(Array.isArray(labels) ? labels : [labels].filter(Boolean));
  const states = allAffixExampleStates().filter(st => st.label && want.has(st.label));
  return states
    .slice()
    .sort(() => Math.random() - 0.5)
    .slice(0, n)
    .map(st => ({
      word: st.word,
      meaning: st.meaning,
      phonetic: st.phonetic,
      example: (st.affixes || []).length ? '词缀：' + st.affixes.join(' · ') : '',
      _affixes: st.affixes || [],
      _affixWord: true
    }));
}

function affixExampleFilterButtons(action, current, mode = 'marked') {
  const filters = mode === 'batch'
    ? [['all', '全部'], ['new', '新词'], ['main', '已在主词库'], ['unmarked', '未标记']]
    : [['all', '全部'], ['new', '新词'], ['main', '已在主词库'], ['fuzzy', '模糊'], ['key', '重点'], ['must', '必背'], ['graduate', '已掌握']];
  return filters.map(([v, name]) =>
    `<button class="tool-btn ${current === v ? 'active' : ''}" data-action="${action}" data-filter="${v}">${name}</button>`
  ).join('');
}

/** 抽 N 个未掌握的词缀（未标记优先；按游标顺序取，不足时用已标记补充） */
function pickAffixes(n) {
  const all = affixAll();
  const unlearned = all.filter(a => !affixLabelOf(a));
  const learned = all.filter(a => affixLabelOf(a));
  const start = STORE.aCursor % Math.max(1, unlearned.length || 1);
  const unlearnedPicks = unlearned.slice(start).concat(unlearned.slice(0, start)).slice(0, n);
  const learnedStart = STORE.aCursor % Math.max(1, learned.length || 1);
  const learnedPicks = learned.slice(learnedStart).concat(learned.slice(0, learnedStart)).slice(0, Math.max(0, n - unlearnedPicks.length));
  const picks = [...unlearnedPicks, ...learnedPicks];
  STORE.aCursor = (STORE.aCursor + picks.length) % Math.max(1, (unlearned.length || 1));
  return picks;
}

/** 开始批量整理：先一次性列出本轮词缀 */
function startAffixBatch(n) {
  affixBatch.list = pickAffixes(Math.min(n, affixTotal()));
  affixBatch.mode = 'affix';
  affixBatch.wordFilter = 'all';
  if (affixBatch.list.length === 0) {
    alert('词缀库为空');
    return;
  }
  persist();
  const targetHash = '#/affix-batch';
  if (location.hash === targetHash) {
    route();
  } else {
    location.hash = targetHash;
  }
}

/** 开始逐卡学习：优先学已勾选词缀，未勾选时学本轮全部 */
function startAffixStudyFromBatch(checkedOnly) {
  if (!affixBatch.list.length) return;
  let list = affixBatch.list;
  if (checkedOnly) {
    const checked = new Set([...document.querySelectorAll('.batch-check:checked')].map(el => el.dataset.key));
    list = affixBatch.list.filter(a => checked.has(affixKey(a)));
    if (list.length === 0) {
      alert('请先勾选要逐卡学习的词缀');
      return;
    }
  }
  affixSession.list = list;
  affixSession.idx = 0;
  affixSession.current = list[0] || null;
  affixSession.showing = true;
  location.hash = '#/affix-study';
}

/** 翻面 */
function flipAffixCard() {
  affixSession.showing = !affixSession.showing;
  route();
}

/** 打标签 */
function markAffixLabel(label) {
  if (!affixSession.current) return;
  const k = affixKey(affixSession.current);
  STORE.aLabels[k] = label;
  STORE.aStudied[k] = (STORE.aStudied[k] || 0) + 1;
  // 推进到下一个
  affixSession.idx++;
  if (affixSession.idx >= affixSession.list.length) {
    STORE.aSessions++;
    STORE.aTotals += affixSession.list.length;
    affixSession.current = null;
    persist();
    location.hash = '#/affix-result';
  } else {
    affixSession.current = affixSession.list[affixSession.idx];
    affixSession.showing = true;
    route();
  }
}

function affixMastery() {
  const total = affixTotal();
  if (!total) return 0;
  const lb = affixCountLabels();
  return Math.round(((lb.graduate + lb.know) / total) * 100);
}
/** 统计短语各标签数 */
function phraseCountLabels() {
  const r = { know: 0, fuzzy: 0, key: 0, must: 0, graduate: 0 };
  Object.keys(STORE.pLabels).forEach(k => {
    const l = STORE.pLabels[k];
    if (r[l] !== undefined) r[l]++;
  });
  return r;
}
/** 短语已学数 */
function phraseStudiedCount() {
  return Object.keys(STORE.pStudied).filter(k => k.startsWith('phrase:')).length;
}
/** 短语掌握度 = (过关+认识) / 总数 × 100 */
function phraseMastery() {
  const total = phraseTotal();
  if (total === 0) return 0;
  const lb = phraseCountLabels();
  return Math.round((lb.graduate + lb.know) / total * 1000) / 10;
}
/**
 * 从短语本抽词（游标顺序推进，复用单词本同款逻辑）
 * 跳过已过关的短语，未学优先，不足时从已学随机补充
 * @param {number} n - 抽取数量
 * @returns {Array} 短语对象数组
 */
function pickPhrases(n) {
  const list = (window.PHRASES || []).filter(p => phraseLabelOf(p.phrase) !== 'graduate');
  if (list.length === 0) return [];
  const unlearned = list.filter(p => !STORE.pStudied[phraseKey(p.phrase)]);
  const learned   = list.filter(p =>  STORE.pStudied[phraseKey(p.phrase)]);
  if (STORE.pCursor >= unlearned.length) STORE.pCursor = 0;
  const take = Math.min(n, unlearned.length);
  const result = [];
  if (unlearned.length > 0) {
    let i = STORE.pCursor;
    while (result.length < take) {
      result.push(unlearned[i]);
      i++;
      if (i >= unlearned.length) i = 0;
    }
    STORE.pCursor = (STORE.pCursor + take) % Math.max(1, unlearned.length);
  }
  if (result.length < n && learned.length > 0) {
    const used = new Set(result.map(p => p.phrase));
    while (result.length < n && used.size < learned.length) {
      const cand = learned.filter(p => !used.has(p.phrase));
      const shuffled = cand.sort(() => Math.random() - 0.5);
      result.push(shuffled[0]);
      used.add(shuffled[0].phrase);
    }
  }
  persist();
  return result;
}

/** 解析 hash 并渲染对应页面 */
function route() {
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  const p = parts[0] || 'home';
  const app = document.getElementById('app');
  let html = '';
  if (p === 'home' || p === '') html = renderHome();
  else if (p === 'cat') html = renderCat(parts[1]);
  else if (p === 'label-book') html = renderLabelBook(parts[1], parts[2], parseInt(parts[3] || '1', 10));
  else if (p === 'study') html = renderStudy(parts[1], parseInt(parts[2] || '20', 10));
  else if (p === 'review') html = renderReview(parts[1]);
  else if (p === 'result') html = renderResult(parts[1]);
  else if (p === 'stats') html = renderStats();
  else if (p === 'lookup') html = renderLookup();
  else if (p === 'phrase') html = renderPhraseBook();
  else if (p === 'affix') html = renderAffix();
  else if (p === 'affix-batch') html = renderAffixBatch();
  else if (p === 'affix-words') html = renderAffixWordsBook();
  else if (p === 'affix-study') html = renderAffixStudy();
  else if (p === 'affix-result') html = renderAffixResult();
  else if (p === 'profile') html = renderProfile();
  else if (p === 'unlock') html = renderUnlock();
  else if (p === 'dev-plan') { renderDevPlan(app); return; }
  else if (p === 'changelog') { renderChangelog(app); return; }
  else html = renderHome();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  // 注入 footer 邮箱（innerHTML 不执行 <script>，必须在这里手动调用）
  if (typeof updateContactEmail === 'function') updateContactEmail();
  // 路由渲染完，如果是学习页，立即把当前圆环进度渲染出来
  const p2 = (location.hash.slice(1) || '/').split('/').filter(Boolean)[0] || 'home';
  if (p2 === 'study' && timer.id) timerRender();

  // 同步 APP_VERSION 到 header 徽章
  const verEl = document.getElementById('app-version');
  if (verEl) verEl.textContent = APP_VERSION;
}

  const color = masteryColor(pct);
  // 各 level 统计
  const levels = {};
  (window.PHRASES || []).forEach(p => { levels[p.level] = (levels[p.level] || 0) + 1; });

  return `
  <header class="topbar">
    <button class="back" data-action="go-home">‹ 返回</button>
    <div>📚 短语本</div><div></div>
  </header>
  <main class="page">
    <div class="stat-block">
      <h3>短语本</h3>
      <div class="stat-grid">
        <span class="l">总短语</span><span class="v">${total}</span>
        <span class="l">已学</span><span class="v">${studied}</span>
        <span class="l">过关</span><span class="v">${lb.graduate}</span>
        <span class="l">掌握度</span><span class="v" style="color:${color}">${pct}%</span>
      </div>
      <div class="level-tags">
        ${Object.entries(levels).map(([lv, cnt]) =>
          `<span class="level-tag">${lv} ${cnt}</span>`
        ).join('')}
      </div>
    </div>

    <div class="section-title">选择数量开始练习</div>
    <div class="num-row">
      ${[10, 20, 50].map(n => `<button class="num-btn" data-action="phrase-study" data-n="${n}">${n}</button>`).join('')}
      <button class="num-btn-pro" data-action="phrase-study" data-n="100">100</button>
      <button class="num-btn-max" data-action="phrase-study" data-n="9999">全部</button>
    </div>
    <p class="hint">每条短语 12 秒，比单词节奏更宽</p>
  </main>`;
}

/** 分类页：选数量 + 复习入口 + 该分类统计 */
function renderCat(cat) {
  if (!CATS[cat]) { location.hash = '#/'; return ''; }
  const total = catCount(cat);
  const accessible = accessibleWords(cat);
  const accessibleCount = accessible.length;
  const isTrial = !isUnlocked() && cat !== 'junior' && accessibleCount < total;
  const lb = countLabels(cat);
  const studied = studiedCount(cat);
  return `
  <header class="topbar">
    <button class="back" data-action="go-home">‹ 返回</button>
    <div>${CATS[cat].icon} ${CATS[cat].name}</div><div></div>
  </header>
  <main class="page">
    <div class="stat-block">
      <h3>${CATS[cat].name} 单词</h3>
      <div class="stat-grid">
        <span class="l">总词数</span><span class="v">${total}</span>
        <span class="l">已学</span><span class="v">${studied}</span>
        <span class="l">完成轮数</span><span class="v">${STORE.sessions[cat] || 0}</span>
      </div>
      <div class="tag-row">
        ${LABEL_ORDER.map(l => `<button class="tag tag-btn" style="background:${LABELS[l].color}" data-action="go-label-book" data-cat="${cat}" data-label="${l}" title="整理${LABELS[l].name}词表">${LABELS[l].name} ${lb[l]}</button>`).join('')}
      </div>
      ${isTrial ? `
      <p class="hint">当前试学 ${accessibleCount} / ${total} 词，登录 DaoBox 账号后免费解锁全部。</p>
      <button class="btn-main" data-action="go-unlock">🔓 免费解锁全部词本</button>
      ` : ''}
    </div>

    <div class="section-title">选择数量开始学习</div>
    <div class="num-row unified-num-row">
      ${[10, 20, 50, 100, 200].filter(n => n <= accessibleCount).map(n => `<button class="num-btn" data-action="study" data-cat="${cat}" data-n="${n}">${n}</button>`).join('')}
    </div>

    <button class="btn-ghost" data-action="go-review" data-cat="${cat}">按标签复习（强化记忆）</button>
    <button class="btn-ghost" data-action="review-graduate" data-cat="${cat}">复习过关词（${lb.graduate}）</button>
    <button class="btn-ghost" data-action="reset-graduate" data-cat="${cat}">重置过关（${lb.graduate}）</button>
  </main>`;
}

// ===== 标签词表管理（全词本通用） =====
const LABEL_BOOK_PAGE_SIZE = 50;
let labelBookState = { search: '' };

function labelBookWords(cat, label) {
  const q = labelBookState.search.trim().toLowerCase();
  return accessibleWords(cat)
    .filter(w => labelOf(cat, w.word) === label)
    .filter(w => !q
      || String(w.word || '').toLowerCase().includes(q)
      || String(w.meaning || '').toLowerCase().includes(q));
}

function renderLabelBook(cat, label, page) {
  if (!CATS[cat] || !LABELS[label]) { location.hash = '#/'; return ''; }

  const all = labelBookWords(cat, label);
  const totalPages = Math.max(1, Math.ceil(all.length / LABEL_BOOK_PAGE_SIZE));
  const currentPage = Math.min(Math.max(1, page), totalPages);
  const start = (currentPage - 1) * LABEL_BOOK_PAGE_SIZE;
  const rows = all.slice(start, start + LABEL_BOOK_PAGE_SIZE).map(w => {
    const current = labelOf(cat, w.word) || '';
    return `
      <div class="label-book-row">
        <input class="label-book-check" type="checkbox" data-cat="${cat}" data-word="${escapeHtml(w.word)}" aria-label="选择 ${escapeHtml(w.word)}">
        <div class="label-book-word">
          <b>${escapeHtml(w.word)}</b>
          <button class="affix-speak-btn" data-action="speak" data-word="${escapeHtml(w.word)}" title="朗读 ${escapeHtml(w.word)}" aria-label="朗读 ${escapeHtml(w.word)}">🔊</button>
          <small>${escapeHtml(w.meaning || '—')}</small>
        </div>
        <select class="label-book-select" data-cat="${cat}" data-word="${escapeHtml(w.word)}" aria-label="修改 ${escapeHtml(w.word)} 的标签">
          <option value="" ${current === '' ? 'selected' : ''}>未标记</option>
          ${LABEL_ORDER.map(l => `<option value="${l}" ${current === l ? 'selected' : ''}>${LABELS[l].name}</option>`).join('')}
        </select>
      </div>`;
  }).join('');

  return `
    <header class="topbar">
      <button class="back-btn" data-action="go-cat" data-cat="${cat}">← 返回</button>
      <div class="brand">${CATS[cat].name} · ${LABELS[label].name}</div>
    </header>
    <main class="page batch-page">
      <div class="affix-intro">
        <h3>🏷️ ${LABELS[label].name}词表</h3>
        <p>当前标签共 ${all.length} 个词。每页 50 个；右侧改标签后立即保存。</p>
      </div>

      <div class="label-book-searchbar">
        <input type="text" id="label-book-search" value="${escapeHtml(labelBookState.search)}" placeholder="🔍 搜索单词或释义" autocomplete="off">
        <button class="tool-btn" data-action="label-book-search">筛选</button>
      </div>

      <div class="batch-toolbar">
        <div>
          <b>${all.length}</b> 个词
          <small>已选 <span id="label-book-selected-count">0/${rows.length}</span></small>
        </div>
        <div class="batch-tools">
          <button class="tool-btn" data-action="label-book-select" data-mode="all">全选本页</button>
          <button class="tool-btn" data-action="label-book-select" data-mode="none">取消</button>
        </div>
      </div>

      <div class="label-book-list">${rows || '<p class="empty">没有匹配的单词。</p>'}</div>

      <div class="label-book-pagination">
        <button class="tool-btn" data-action="label-book-page" data-page="prev" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>
        <span>${currentPage} / ${totalPages}</span>
        <button class="tool-btn" data-action="label-book-page" data-page="next" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>
      </div>

      <div class="label-btns batch-actions">
        ${LABEL_ORDER.map(l => `<button class="label-btn" style="--c:${LABELS[l].color}" data-action="label-book-batch-label" data-cat="${cat}" data-label="${l}">${LABELS[l].name}</button>`).join('')}
        <button class="label-btn" style="--c:#64748b" data-action="label-book-batch-label" data-cat="${cat}" data-label="">未标记</button>
      </div>
    </main>`;
}

function updateLabelBookSelectedCount() {
  const el = document.getElementById('label-book-selected-count');
  if (!el) return;
  const total = document.querySelectorAll('.label-book-check').length;
  const selected = document.querySelectorAll('.label-book-check:checked').length;
  el.textContent = `${selected}/${total}`;
}

function selectLabelBookPage(mode) {
  document.querySelectorAll('.label-book-check').forEach(input => {
    input.checked = mode === 'all';
  });
  updateLabelBookSelectedCount();
}

function setLabelBookWordLabel(cat, word, label) {
  const key = wordKey(cat, word);
  if (label && LABELS[label]) STORE.labels[key] = label;
  else delete STORE.labels[key];
  persist();
}

function markLabelBookBatchLabel(cat, label) {
  const checked = [...document.querySelectorAll('.label-book-check:checked')];
  if (!checked.length) {
    alert('请先勾选要调整的单词');
    return;
  }
  checked.forEach(input => setLabelBookWordLabel(input.dataset.cat || cat, input.dataset.word, label));
  const labelText = label ? LABELS[label].name : '未标记';
  showToast(`已保存 ${checked.length} 个词：${labelText}`, 'success');
  route();
}

/** 学习卡片页 */
function renderStudy(cat, n) {
  const isLookup = cat === 'lookup';
  const isPhrase = cat === 'phrase';
  const isAffixWords = cat === 'affix-words';
  if (!isLookup && !isPhrase && !isAffixWords && !CATS[cat]) { location.hash = '#/'; return ''; }
  // 无会话或分类不符时重新抽词
  if (!session || session.cat !== cat || session.words.length === 0) {
    const words = isLookup ? pickFromLookups(n) : isPhrase ? pickPhrases(n) : isAffixWords ? pickAffixExampleWords(['fuzzy', 'key', 'must'], n) : pickWords(cat, n);
    startSession(cat, words);
  }
  // 已完成则跳结果页
  if (session.idx >= session.words.length) {
    location.hash = '#/result/' + cat;
    return '';
  }
  const s = session;
  const w = s.words[s.idx];
  // 短语模式用 w.phrase，单词模式用 w.word
  const displayText = isPhrase ? w.phrase : w.word;
  const ph = (!isPhrase && w.phonetic) ? `<div class="phonetic">/${w.phonetic}/</div>` : '';
  const ex = w.example ? `<div class="example">${w.example}</div>` : '';
  // 🔊 发音按钮：点击调有道真人发音
  const speakBtn = `<button class="speak-btn" data-action="speak" data-word="${displayText}" title="朗读">🔊</button>`;
  // 查词本模式：显示所属分类 + 当前标签 + 查词次数
  let lookupInfo = '';
  if (isAffixWords) {
    const st = affixWordState(w.word);
    const lb = st.label && LABELS[st.label] ? LABELS[st.label] : null;
    const lbText = lb ? `<span class="tag" style="background:${lb.color}">${lb.name}</span>` : '<span class="tag" style="background:#bbb">未标记</span>';
    const affixes = (w._affixes || st.affixes || []).map(a => escapeHtml(a)).join(' · ');
    lookupInfo = `<div class="lookup-info"><span>📐 ${affixes || '词缀例词'}</span> ${lbText}</div>`;
  }
  if (isLookup && w._cat) {
    const catName = CATS[w._cat] ? CATS[w._cat].name : w._cat;
    const catColor = CATS[w._cat] ? CATS[w._cat].color : '#999';
    const lb = labelOf(w._cat, w.word);
    const lbText = lb ? `<span class="tag" style="background:${LABELS[lb].color}">${LABELS[lb].name}</span>` : '<span class="tag" style="background:#bbb">未标记</span>';
    lookupInfo = `<div class="lookup-info"><span style="color:${catColor}">📚 ${catName}</span> ${lbText} <small>已查 ${w._lookupCount || 0} 次</small></div>`;
  }
  // 短语模式：显示 level + 当前标签
  let phraseInfo = '';
  if (isPhrase) {
    const lb = phraseLabelOf(w.phrase);

/** 结果页：本次标签分布 */
function renderResult(cat) {
  if (!session) {
    location.hash = cat === 'lookup' ? '#/lookup' : cat === 'phrase' ? '#/phrase' : '#/cat/' + (cat || 'junior');
    return '';
  }
  const isLookup = session.cat === 'lookup';
  const isPhrase = session.cat === 'phrase';
  const isAffixWords = session.cat === 'affix-words';
  const total = session.words.length;
  const dist = LABEL_ORDER.map(l =>
    `<div class="dist-row"><span style="color:${LABELS[l].color}">●</span> ${LABELS[l].name} <b>${session.labels[l] || 0}</b></div>`
  ).join('');
  const skipped = total - LABEL_ORDER.reduce((s, l) => s + (session.labels[l] || 0), 0);
  // ===== 用时统计 =====
  const secPer = isPhrase ? SEC_PER_PHRASE : SEC_PER_WORD;
  const targetMs = total * secPer * 1000;
  let elapsedMs = timer.totalElapsed;
  if (elapsedMs <= 0) {
    elapsedMs = timer.totalMs > 0 ? (timer.totalMs - timer.remainMs) : 0;
  }
  const perWordMs = total > 0 ? elapsedMs / total : 0;
  const unit = isPhrase ? '条' : '词';
  const elapsedRow = elapsedMs > 0 ? `
    <div class="dist-row">
      <span>⏱</span>
      <b>实际 ${fmtTime(elapsedMs)} / 目标 ${fmtTime(targetMs)}</b>
      <small style="color:var(--ink-soft);margin-left:auto">平均每${unit} ${(perWordMs/1000).toFixed(2)} 秒</small>
    </div>` : '';
  const againAction = isLookup ? 'lookup-study' : isPhrase ? 'phrase-study' : isAffixWords ? 'affix-words-review' : 'study';
  const againData = (isLookup || isPhrase || isAffixWords) ? '' : `data-cat="${session.cat}"`;

  return `
  <main class="page result">

    <h2>完成 ${total} 个${unit}</h2>
    <div class="dist">

// ===== 学习交互 =====

/**
 * 朗读英文单词
 * 主方案：有道词典真人发音接口（dict.youdao.com/dictvoice），需联网，返回真人 MP3
 * 兜底：Web Speech API（speechSynthesis），离线可用，Chrome 部分版本可能静默
 * @param {string} word - 要朗读的英文单词
 */
function speakWord(word) {
  if (!word) return;
  try {
    // 取消正在播放的音频（如果有），避免叠加
    if (speakWord._audio) {
      speakWord._audio.pause();
      speakWord._audio.src = '';
      speakWord._audio.onended = null;
      speakWord._audio.onerror = null;
      speakWord._audio = null;
    }
    // 取消 Web Speech（如果之前有残留），避免与有道叠加
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();

    // 有网：优先有道真人发音（type=2 美式，只有一个女声）
    if (navigator.onLine) {
      const url = `https://dict.youdao.com/dictvoice?type=2&audio=${encodeURIComponent(word)}`;
      const audio = new Audio(url);
      audio.playbackRate = 0.9;
      let fallbackFired = false;
      // 只有真正的网络/资源加载失败才回退 Web Speech
      audio.onerror = () => {
        if (fallbackFired) return;
        fallbackFired = true;
        console.warn('[speak] 有道加载失败，退回 Web Speech →', word);
        speakBySpeech(word);
      };
      // play() 的 catch 仅处理自动播放策略拦截等浏览器侧拒绝，不重复回退
      audio.play().catch(err => {
        // 如果是 NotAllowedError（没用户手势/静音了），但 onerror 未触发说明资源本身 OK，就不回退
        // 只在明确是资源错误类时，兜底一次（fallbackFired 防止重复）
        if (!fallbackFired && err && err.name === 'NotSupportedError') {
          fallbackFired = true;
          speakBySpeech(word);
        }
      });
      speakWord._audio = audio;
      console.log('[speak] 有道发音 →', word);
    } else {
      // 离线：直接用 Web Speech
      speakBySpeech(word);
    }
  } catch (e) {
    console.error('[speak] 异常:', e);
  }
}

/**
 * Web Speech API 兜底发音（离线可用）
 * Chrome 在 macOS 上可能静默，作为次选
 */
function speakBySpeech(word) {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    console.log('[speak] Web Speech 兜底 →', word);
  } catch (e) { /* 静默失败 */ }
}

/** 翻面显示中文，同时将当前词标记为"已学"（防中途退出导致反复出现在未学池） */
function flipCard() {
  if (!session) return;
  session.flipped = true;
  const w = session.words[session.idx];
  if (session.cat === 'phrase') {
    // 短语模式：用短语存储
    const pk = phraseKey(w.phrase);
    if (!STORE.pStudied[pk]) { STORE.pStudied[pk] = 1; persist(); }
  } else if (session.cat === 'affix-words') {
    const key = normalizeWordKey(w.word);
    if (STORE.aWords[key] && !STORE.aWords[key].studied) STORE.aWords[key].studied = 1;
  } else {
    // 单词/查词本模式
    const realCat = w._cat || session.cat;
    const k = wordKey(realCat, w.word);
    if (!STORE.studied[k]) { STORE.studied[k] = 1; persist(); }
  }
  route();
}

/** 给当前词打标签并进入下一个 */
function markLabel(label) {
  if (!session) return;
  const w = session.words[session.idx];
  if (session.cat === 'phrase') {
    // 短语模式：用短语存储
    const pk = phraseKey(w.phrase);
    STORE.pLabels[pk] = label;
    STORE.pStudied[pk] = (STORE.pStudied[pk] || 0) + 1;
    STORE.pTotals = (STORE.pTotals || 0) + 1;
  } else if (session.cat === 'affix-words') {
    // 词缀例词：已有词写回主词库，新词写入 aWords
    setAffixExampleWordLabel(w.word, label);
  } else {
    // 单词/查词本模式
    const realCat = w._cat || session.cat;
    const k = wordKey(realCat, w.word);
    STORE.labels[k] = label;
    STORE.studied[k] = (STORE.studied[k] || 0) + 1;
    STORE.totals[realCat] = (STORE.totals[realCat] || 0) + 1;
  }
  session.labels[label] = (session.labels[label] || 0) + 1;
  advance();
}

/** 跳过当前词（不打标签）*/
function skipCard() { if (session) advance(); }

/** 推进到下一张卡，若用完则完成打卡并跳结果页 */
function advance() {
  session.idx++;
  session.flipped = false;
  if (session.idx >= session.words.length) {
    // 全部背完：累计实际用时、停止计时
    timer.totalElapsed += (timer.totalMs - timer.remainMs);
    timerStop();
    if (session.cat === 'phrase') {
      STORE.pSessions = (STORE.pSessions || 0) + 1;
    } else if (session.cat === 'affix-words') {
      // 词缀例词独立于五个主词库统计
    } else {
      STORE.sessions[session.cat] = (STORE.sessions[session.cat] || 0) + 1;
    }
    checkin();
    persist();
    checkAutoBackup();
    location.hash = '#/result/' + session.cat;
  } else {
    persist();
    route();
  }
}
